esphome:
  name: sunton-28-sonos-panel
  friendly_name: Sunton Sonos Panel
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

web_server:

substitutions:
  player: media_player.arc
  ha_url: !secret ha_url   # e.g. http://192.168.1.114:8123 (no trailing slash)

# ---------------------------------------------------------------- album art
http_request:
  timeout: 10s
  buffer_size_rx: 4096

online_image:
  - id: album_art
    url: "${ha_url}/static/icons/favicon-192x192.png"
    format: PNG
    type: RGB565
    resize: 84x84
    buffer_size: 4096
    update_interval: never
    on_download_finished:
      then:
        - lvgl.image.update:
            id: art_img
            src: album_art
        - lvgl.widget.hide: art_circle
        - lvgl.widget.show: art_img
    on_error:
      then:
        - lvgl.widget.show: art_circle
        - lvgl.widget.hide: art_img

# ---------------------------------------------------------------- time
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_clock
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: update_clock

globals:
  - id: tv_mode
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: screen_sleeping
    type: bool
    restore_value: no
    initial_value: 'false'

# ---------------------------------------------------------------- hardware
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: main_display
    model: ESP32-2432S028
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: main_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    update_interval: 20ms
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

# ---------------------------------------------------------------- fonts
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 24
    bpp: 4
    glyphsets:
      - GF_Latin_Core

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_artist
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Core

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_small
    size: 14
    bpp: 4
    glyphsets:
      - GF_Latin_Core

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_clock
    size: 72
    bpp: 4
    glyphs: "0123456789:"

# ---------------------------------------------------------------- Home Assistant data
text_sensor:
  - platform: homeassistant
    id: sonos_title
    entity_id: ${player}
    attribute: media_title
    on_value:
      then:
        - lvgl.label.update:
            id: title_lbl
            text: !lambda 'return x.empty() ? std::string("—") : x;'
        - script.execute: refresh_media

  - platform: homeassistant
    id: sonos_artist
    entity_id: ${player}
    attribute: media_artist
    on_value:
      then:
        - lvgl.label.update:
            id: artist_lbl
            text: !lambda 'return x;'

  - platform: homeassistant
    id: sonos_source
    entity_id: ${player}
    attribute: source
    on_value:
      then:
        - logger.log:
            format: "Sonos source: '%s'"
            args: ['x.c_str()']
        - script.execute: refresh_media

  - platform: homeassistant
    id: sonos_picture
    entity_id: ${player}
    attribute: entity_picture
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x.empty();'
            then:
              - lvgl.widget.show: art_circle
              - lvgl.widget.hide: art_img
            else:
              - online_image.set_url:
                  id: album_art
                  url: !lambda 'return std::string("${ha_url}") + x;'

  - platform: homeassistant
    id: sonos_state
    entity_id: ${player}
    on_value:
      then:
        - script.execute: refresh_state

sensor:
  - platform: homeassistant
    id: sonos_volume
    entity_id: ${player}
    attribute: volume_level
    on_value:
      then:
        - lambda: |-
            if (!lv_obj_has_state(id(vol_slider), LV_STATE_PRESSED)) {
              lv_slider_set_value(id(vol_slider), (int) (x * 100.0f + 0.5f), LV_ANIM_ON);
            }

# ---------------------------------------------------------------- scripts
script:
  # Home Assistant drops artist / picture attributes on the TV source, which the
  # ESP never sees as a change: detect TV mode and clear the stale values.
  - id: refresh_media
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sonos_source).state == "TV" || id(sonos_title).state == "TV";'
          then:
            - lambda: 'id(tv_mode) = true;'
            - lvgl.label.update:
                id: artist_lbl
                text: ""
            - lvgl.widget.show: art_circle
            - lvgl.widget.hide: art_img
          else:
            - if:
                condition:
                  lambda: 'return id(tv_mode);'
                then:
                  - lambda: 'id(tv_mode) = false;'
                  - lvgl.label.update:
                      id: artist_lbl
                      text: !lambda 'return id(sonos_artist).state;'
                  - if:
                      condition:
                        lambda: 'return !id(sonos_picture).state.empty();'
                      then:
                        - online_image.set_url:
                            id: album_art
                            url: !lambda 'return std::string("${ha_url}") + id(sonos_picture).state;'

  - id: refresh_state
    then:
      - lambda: |-
          const std::string &s = id(sonos_state).state;
          bool playing = (s == "playing");
          lv_color_t c;
          const char *txt;
          if (playing)            { c = lv_color_hex(0x5BE39B); txt = "EN LECTURE"; }
          else if (s == "paused") { c = lv_color_hex(0xFFB74D); txt = "PAUSE"; }
          else if (s == "idle" || s == "off" || s == "standby") { c = lv_color_hex(0x8A93AB); txt = "VEILLE"; }
          else                    { c = lv_color_hex(0x4DD6E6); txt = "..."; }

          lv_label_set_text(id(state_lbl), txt);
          lv_obj_set_style_text_color(id(state_lbl), c, 0);
          lv_obj_set_style_bg_color(id(state_dot), c, 0);
          lv_obj_set_style_bg_color(id(art_circle), c, 0);
          lv_label_set_text(id(play_icon), playing ? "\xEF\x81\x8C" : "\xEF\x81\x8B");

  - id: update_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          static const char *days[] = {"Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"};
          static const char *months[] = {"janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"};
          char buf[48];
          snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
          lv_label_set_text(id(clock_lbl), buf);
          snprintf(buf, sizeof(buf), "%s %d %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
          lv_label_set_text(id(date_lbl), buf);

  - id: go_to_sleep
    then:
      - lambda: 'id(screen_sleeping) = true;'
      - lvgl.page.show: clock_page
      - light.turn_on:
          id: display_backlight
          brightness: 55%

  - id: wake_up
    then:
      - lambda: 'id(screen_sleeping) = false;'
      - lvgl.page.show: main_page
      - light.turn_on:
          id: display_backlight
          brightness: 100%

# Sleep after 30 s of inactivity, unless music is playing
interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lambda: 'return !id(screen_sleeping) && id(sonos_state).state != "playing";'
              - lvgl.is_idle:
                  timeout: 30s
          then:
            - script.execute: go_to_sleep

# ---------------------------------------------------------------- UI
lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  buffer_size: 25%
  bg_color: 0x0B0E17
  style_definitions:
    - id: style_card
      bg_color: 0x151B2C
      bg_opa: COVER
      radius: 18
      border_width: 1
      border_color: 0x232B44
      pad_all: 0
    - id: style_btn
      bg_color: 0x1B2338
      bg_opa: COVER
      radius: 100%
      border_width: 1
      border_color: 0x2C3858
      shadow_width: 0
      text_color: 0xE6ECFA
      text_font: montserrat_20
  pages:
    # ------------------------------------------------ main page
    - id: main_page
      bg_color: 0x0B0E17
      widgets:
        # header
        - label:
            id: header_lbl
            text: "SONOS ARC"
            text_font: font_small
            text_color: 0x8A93AB
            text_letter_space: 2
            align: TOP_LEFT
            x: 14
            y: 12
        - obj:
            id: state_dot
            width: 8
            height: 8
            radius: 100%
            bg_color: 0x4DD6E6
            bg_opa: COVER
            border_width: 0
            align: TOP_RIGHT
            x: -14
            y: 16
        - label:
            id: state_lbl
            text: "..."
            text_font: font_small
            text_color: 0x4DD6E6
            align: TOP_RIGHT
            x: -28
            y: 12

        # now playing card
        - obj:
            styles: style_card
            x: 10
            y: 38
            width: 220
            height: 150
            scrollbar_mode: "OFF"
            widgets:
              - image:
                  id: art_img
                  src: album_art
                  hidden: true
                  align: TOP_MID
                  y: 8
                  radius: 12
                  clip_corner: true
              - obj:
                  id: art_circle
                  width: 52
                  height: 52
                  radius: 100%
                  bg_color: 0x4DD6E6
                  bg_opa: COVER
                  border_width: 0
                  align: TOP_MID
                  y: 14
                  widgets:
                    - label:
                        text: ""
                        text_font: montserrat_28
                        text_color: 0x0B0E17
                        align: CENTER
              - label:
                  id: title_lbl
                  text: "—"
                  text_font: font_title
                  text_color: 0xFFFFFF
                  long_mode: SCROLL_CIRCULAR
                  width: 196
                  text_align: CENTER
                  align: TOP_MID
                  y: 94
              - label:
                  id: artist_lbl
                  text: ""
                  text_font: font_artist
                  text_color: 0x4DD6E6
                  long_mode: SCROLL_CIRCULAR
                  width: 196
                  text_align: CENTER
                  align: TOP_MID
                  y: 124

        # transport controls
        - button:
            id: prev_btn
            styles: style_btn
            width: 56
            height: 56
            x: 22
            y: 202
            on_click:
              - homeassistant.action:
                  action: media_player.media_previous_track
                  data:
                    entity_id: ${player}
            widgets:
              - label:
                  text: ""
                  text_font: montserrat_20
                  align: CENTER
        - button:
            id: play_btn
            styles: style_btn
            width: 68
            height: 68
            x: 86
            y: 196
            bg_color: 0x4DD6E6
            border_width: 0
            text_color: 0x0B0E17
            on_click:
              - homeassistant.action:
                  action: media_player.media_play_pause
                  data:
                    entity_id: ${player}
            widgets:
              - label:
                  id: play_icon
                  text: ""
                  text_font: montserrat_28
                  text_color: 0x0B0E17
                  align: CENTER
        - button:
            id: next_btn
            styles: style_btn
            width: 56
            height: 56
            x: 162
            y: 202
            on_click:
              - homeassistant.action:
                  action: media_player.media_next_track
                  data:
                    entity_id: ${player}
            widgets:
              - label:
                  text: ""
                  text_font: montserrat_20
                  align: CENTER

        # volume
        - label:
            text: ""
            text_font: montserrat_20
            text_color: 0x8A93AB
            x: 14
            y: 284
        - slider:
            id: vol_slider
            x: 46
            y: 292
            width: 148
            height: 8
            min_value: 0
            max_value: 100
            value: 20
            bg_color: 0x232B44
            bg_opa: COVER
            indicator:
              bg_color: 0x4DD6E6
            knob:
              bg_color: 0xFFFFFF
              pad_all: 5
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  data:
                    entity_id: ${player}
                    volume_level: !lambda 'return lv_slider_get_value(id(vol_slider)) / 100.0f;'
        - label:
            text: ""
            text_font: montserrat_20
            text_color: 0x8A93AB
            align: TOP_RIGHT
            x: -12
            y: 284

    # ------------------------------------------------ clock / sleep page
    - id: clock_page
      bg_color: 0x080C16
      on_press:
        - script.execute: wake_up
      widgets:
        - label:
            id: clock_lbl
            text: "--:--"
            text_font: font_clock
            text_color: 0xD6EAFF
            align: CENTER
            y: -20
        - label:
            id: date_lbl
            text: ""
            text_font: font_artist
            text_color: 0xA9BDE0
            align: CENTER
            y: 40
        - label:
            text: "Touchez pour reveiller"
            text_font: font_small
            text_color: 0x6B7A9C
            align: BOTTOM_MID
            y: -16
